name: Stage 2 shell push gate

on:
  push:
    branches:
      - codex/stage2-runtime-shell

permissions:
  contents: read

concurrency:
  group: stage2-shell-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Record source identity
        run: |
          git rev-parse HEAD
          test -z "$(git status --short)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm --prefix apps/web install --no-audit --no-fund

      - name: Build web shell
        run: npm --prefix apps/web run build

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Start integrated runtime
        run: docker compose up -d

      - name: Wait for API and web
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health >/tmp/health.json &&
              curl --fail --silent http://localhost:8000/demo/overview >/tmp/overview.json &&
              curl --fail --silent http://localhost:3000 >/tmp/web.html; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify product and safety boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/health.json").read_text())
          overview = json.loads(Path("/tmp/overview.json").read_text())
          web = Path("/tmp/web.html").read_text()

          assert health["status"] == "ok"
          assert "Human approval" in overview["flow"]
          assert "Submission simulation" in overview["flow"]
          assert "No real tender portal submission is executed." in overview["boundaries"]
          assert "No real customer payment is charged." in overview["boundaries"]
          assert "Stage 2 product shell" in web
          assert "Synthetic data is used for the current demo path." in web
          PY

      - name: Capture desktop and mobile evidence
        run: |
          npx --yes playwright@1.54.1 install --with-deps chromium
          npx --yes playwright@1.54.1 screenshot --browser chromium --viewport-size "1440,1000" http://localhost:3000 stage2-shell-desktop.png
          npx --yes playwright@1.54.1 screenshot --browser chromium --viewport-size "390,844" --full-page http://localhost:3000 stage2-shell-mobile.png

      - name: Upload rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage2-shell-rendered-evidence
          path: |
            stage2-shell-desktop.png
            stage2-shell-mobile.png
          if-no-files-found: error
          retention-days: 14

      - name: Show service state and logs
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --no-color api web || true

      - name: Stop integrated runtime
        if: always()
        run: docker compose down --volumes || true
