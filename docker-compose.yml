services:
  backend:
    image: python:3.12-slim
    working_dir: /repo
    environment:
      PYTHONPATH: src
      VERMITLO_HOST: 0.0.0.0
      VERMITLO_PORT: 8000
    command: sh -c "python -m vermitlo_mvp.server"
    volumes:
      - ./:/repo
    ports:
      - "8000:8000"

  web:
    image: node:20-alpine
    working_dir: /repo/apps/web
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./:/repo
      - web_node_modules:/repo/apps/web/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  web_node_modules:
