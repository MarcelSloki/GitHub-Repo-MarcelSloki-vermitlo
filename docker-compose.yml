services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "PYTHONPATH=src VERMITLO_HOST=0.0.0.0 python -m vermitlo_mvp.server"
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./apps/web:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend
