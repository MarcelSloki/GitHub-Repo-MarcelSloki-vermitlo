services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "PYTHONPATH=src python -m vermitlo_mvp.server"
    environment:
      VERMITLO_HOST: 0.0.0.0
      VERMITLO_PORT: 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    volumes:
      - ./apps/web:/app
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
